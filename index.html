<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12141A" />
    <meta name="description" content="AGENT — guess the 5-letter word in 5 tries." />
    <title>Words Game</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="header">
        <div class="wordmark" aria-label="AGENT">
          <span class="wordmark-tile">W</span>
          <span class="wordmark-tile">O</span>
          <span class="wordmark-tile">R</span>
          <span class="wordmark-tile">D</span>
          <span class="wordmark-tile">S</span>
        </div>
        <div class="header-actions">
          <button type="button" class="btn-icon" id="help-btn" aria-label="How to Play">?</button>
          <button type="button" class="btn-new" id="new-game-btn">New Game</button>
        </div>
      </header>

      <div class="toast-shelf" aria-live="polite">
        <div class="toast" id="toast" hidden></div>
      </div>

      <main class="main">
        <div class="board" id="board" aria-label="Game board"></div>
      </main>

      <div class="keyboard" id="keyboard" aria-label="Keyboard"></div>

      <div class="error-banner" id="error-banner" hidden></div>
    </div>

    <div class="overlay" id="help-overlay" hidden>
      <div class="help-card" role="dialog" aria-labelledby="help-title" aria-modal="true">
        <h2 id="help-title" class="help-title">How to Play</h2>
        <p class="help-lead">Guess the 5-letter word in 5 tries.</p>
        <ul class="help-examples">
          <li>
            <span class="tile tile--correct help-tile">A</span>
            <span class="help-caption"><strong>Green</strong> — right letter, right spot.</span>
          </li>
          <li>
            <span class="tile tile--present help-tile">G</span>
            <span class="help-caption"><strong>Orange</strong> — right letter, wrong spot.</span>
          </li>
          <li>
            <span class="tile tile--absent help-tile">E</span>
            <span class="help-caption"><strong>Gray</strong> — letter not in the word.</span>
          </li>
        </ul>
        <p class="help-dict">
          <a
            class="help-dict-link"
            href="words.html"
            target="_blank"
            rel="noopener noreferrer"
          >Word list — all words</a>
        </p>
        <button type="button" class="btn-primary" id="help-got-it">Got it</button>
      </div>
    </div>

    <script src="js/words.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
