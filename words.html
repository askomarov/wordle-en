<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12141A" />
    <meta name="description" content="Word list — all playable words and pattern search." />
    <title>Word list | Words Game</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <div class="app app--words" id="app">
      <header class="header">
        <a class="wordmark wordmark--link" href="index.html" aria-label="WORDS — back to game">
          <span class="wordmark-tile">W</span>
          <span class="wordmark-tile">O</span>
          <span class="wordmark-tile">R</span>
          <span class="wordmark-tile">D</span>
          <span class="wordmark-tile">S</span>
        </a>
        <div class="header-actions">
          <a class="btn-new" href="index.html">Back to game</a>
        </div>
      </header>

      <main class="words-page">
        <h1 class="words-title">Word list</h1>
        <p class="words-lead">
          Every word you can enter in the game. Set a 5-slot pattern —
          a letter locks that position; empty or <kbd>_</kbd> matches any letter.
        </p>

        <div class="pattern-row" id="pattern-row" role="group" aria-label="5-letter pattern">
          <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off"
            autocapitalize="characters" spellcheck="false" aria-label="Letter 1" data-index="0" />
          <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off"
            autocapitalize="characters" spellcheck="false" aria-label="Letter 2" data-index="1" />
          <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off"
            autocapitalize="characters" spellcheck="false" aria-label="Letter 3" data-index="2" />
          <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off"
            autocapitalize="characters" spellcheck="false" aria-label="Letter 4" data-index="3" />
          <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off"
            autocapitalize="characters" spellcheck="false" aria-label="Letter 5" data-index="4" />
        </div>

        <p class="words-count" id="words-count" aria-live="polite"></p>
        <div class="words-list-wrap">
          <ul class="words-list" id="words-list"></ul>
        </div>
      </main>
    </div>

    <script src="js/words.js"></script>
    <script src="js/words-page.js"></script>
  </body>

</html>
